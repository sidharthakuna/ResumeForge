spring:
  config:
    import: "optional:file:.env[.properties]"
  application:
    name: resume-builder
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/resumebuilder}
    username: ${DB_USERNAME:resumebuilder}
    password: ${DB_PASSWORD:password}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    datatype:
      datetime:
        WRITE_DATES_AS_TIMESTAMPS: false

server:
  port: ${PORT:9090}
logging:
  level:
    com.resumebuilder: ${LOG_LEVEL_RESUMEBUILDER:INFO}
jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

storage:
  provider: ${STORAGE_PROVIDER:local}
  local:
    base-path: ./generated-pdfs
  s3:
    bucket-name: ${S3_BUCKET_NAME:resumebuilder-pdfs}
    region: ${S3_REGION:auto}
    access-key: ${S3_ACCESS_KEY}
    secret-key: ${S3_SECRET_KEY}
    endpoint: ${S3_ENDPOINT:}

ai:
  enabled: ${AI_ENABLED:true}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3.6-flash}
    base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
    timeout-ms: ${GEMINI_TIMEOUT:30000}
  rate-limit:
    capacity: ${AI_REQUEST_LIMIT:10}
    refill-hours: ${AI_REQUEST_REFILL_HOURS:1}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

keepalive:
  enabled: ${KEEPALIVE_ENABLED:false}